<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Forgot Password · IND Homes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
<style>
.role-tabs {
  display: flex;
  background: #eef4f2;
  border-radius: 8px;
  padding: 4px;
  margin-bottom: 20px;
  gap: 4px;
}
.role-tab {
  flex: 1;
  text-align: center;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s ease;
}
.role-tab.active {
  background: #fff;
  color: var(--primary);
  box-shadow: 0 2px 5px rgba(0,0,0,0.06);
}
</style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="role-tabs">
        <a href="forgot-password.html?role=owner" class="role-tab" id="tabOwner">Owner</a>
        <a href="forgot-password.html?role=user" class="role-tab" id="tabUser">User</a>
        <a href="forgot-password.html?role=admin" class="role-tab" id="tabAdmin">Admin</a>
      </div>

      <h1 id="pageTitle">Forgot Password</h1>
      <p class="sub" id="pageSub">Enter your registered email address to receive a password reset link.</p>
      <div id="alertBox"></div>

      <form id="forgotForm">
        <div class="field">
          <label for="email" id="emailLabel">Registered Email Address</label>
          <input type="email" id="email" required autocomplete="email" placeholder="name@example.com" />
        </div>
        <button class="btn block" type="submit" id="sendBtn">Send Password Reset Link</button>
      </form>

      <div class="link-row" style="margin-top:20px;">
        <a href="owner-login.html" id="backLink">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let role = (urlParams.get('role') || 'owner').toLowerCase();
    if (!['owner', 'user', 'admin'].includes(role)) role = 'owner';

    const tabOwner = document.getElementById('tabOwner');
    const tabUser = document.getElementById('tabUser');
    const tabAdmin = document.getElementById('tabAdmin');
    const pageTitle = document.getElementById('pageTitle');
    const pageSub = document.getElementById('pageSub');
    const emailLabel = document.getElementById('emailLabel');
    const backLink = document.getElementById('backLink');

    function applyRole(r) {
      role = r;
      tabOwner.classList.toggle('active', role === 'owner');
      tabUser.classList.toggle('active', role === 'user');
      tabAdmin.classList.toggle('active', role === 'admin');

      if (role === 'owner') {
        document.title = 'Reset Owner Password · IND Homes';
        pageTitle.textContent = 'Reset Owner Password';
        pageSub.textContent = 'Enter your registered property owner email address.';
        emailLabel.textContent = 'Owner Email';
        backLink.href = 'owner-login.html';
        backLink.textContent = '← Back to Owner Login';
      } else if (role === 'user') {
        document.title = 'Reset User Password · IND Homes';
        pageTitle.textContent = 'Reset User Password';
        pageSub.textContent = 'Enter your registered user email address.';
        emailLabel.textContent = 'User Email';
        backLink.href = 'user-login.html';
        backLink.textContent = '← Back to User Login';
      } else {
        document.title = 'Reset Admin Password · IND Homes';
        pageTitle.textContent = 'Reset Admin Password';
        pageSub.textContent = 'Enter your registered administrator email address.';
        emailLabel.textContent = 'Admin Email';
        backLink.href = 'admin-login.html';
        backLink.textContent = '← Back to Admin Login';
      }
    }

    applyRole(role);

    const form = document.getElementById('forgotForm');
    const alertBox = document.getElementById('alertBox');
    const sendBtn = document.getElementById('sendBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending reset link...';
      alertBox.innerHTML = '';
      const email = document.getElementById('email').value.trim();

      try {
        const endpoint = `/${role}/auth/forgot-password`;
        const data = await api.post(endpoint, { email });
        alertBox.innerHTML = `<div class="alert success">${escapeHtml(data.message)}</div>`;
        form.reset();
      } catch (err) {
        alertBox.innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send Password Reset Link';
      }
    });
  </script>
</body>
</html>
