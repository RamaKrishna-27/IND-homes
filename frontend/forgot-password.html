<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Reset Admin Password · IND Homes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Reset Admin Password</h1>
      <p class="sub">Enter your registered admin email address.</p>
      <div id="alertBox"></div>
      <form id="forgotForm">
        <div class="field">
          <label for="email">Admin Email</label>
          <input type="email" id="email" required />
        </div>
        <button class="btn block" type="submit" id="sendBtn">Send Password Reset Email</button>
      </form>
      <div class="link-row"><a href="admin-login.html">Back to Admin Login</a></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('forgotForm');
    const alertBox = document.getElementById('alertBox');
    const sendBtn = document.getElementById('sendBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';
      const email = document.getElementById('email').value.trim();
      try {
        const data = await api.post('/admin/auth/forgot-password', { email });
        alertBox.innerHTML = `<div class="alert success">${escapeHtml(data.message)}</div>`;
        form.reset();
      } catch (err) {
        alertBox.innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send Password Reset Email';
      }
    });
  </script>
</body>
</html>
