<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Owner Login · IND Homes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Owner Login</h1>
      <p class="sub">Sign in to manage your property listings.</p>
      <div id="alertBox"></div>
      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button class="btn block" type="submit">Owner Login</button>
      </form>
      <div class="link-row">
        Don't have an account? <a href="owner-register.html">Register as an Owner</a>
      </div>
      <div class="link-row">
        <a href="user-login.html">Looking for a home instead? User Login</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/portal-auth.js"></script>
  <script>
    initAuthForm({ kind: 'owner', formId: 'loginForm', mode: 'login' });
  </script>
</body>
</html>
