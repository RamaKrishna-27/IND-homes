<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Owner Login · IND Homes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Owner Login</h1>
      <p class="sub">Sign in to manage your property listings.</p>

      <!-- Active Session Notice with Logout Option -->
      <div id="alreadyLoggedIn" style="display:none;margin-bottom:18px;padding:12px 14px;background:#eef7f4;border:1px solid #c2e0d7;border-radius:8px;font-size:13px;color:#1c6f5c;">
        Currently signed in as <strong id="loggedInName">Owner</strong>.
        <div style="margin-top:8px;display:flex;gap:12px;align-items:center;">
          <a href="owner-dashboard.html" class="btn" style="padding:4px 12px;font-size:12px;">Go to Dashboard &rarr;</a>
          <button type="button" id="ownerLogoutBtn" class="btn secondary" style="padding:4px 12px;font-size:12px;color:#c82333;border-color:#f1b0b7;">Log Out</button>
        </div>
      </div>

      <div id="alertBox"></div>
      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" placeholder="owner@example.com" />
        </div>
        <div class="field">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <label for="password" style="margin:0;">Password</label>
            <a href="forgot-password.html?role=owner" style="font-size:12px;color:var(--primary);text-decoration:none;font-weight:500;">Forgot Password?</a>
          </div>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password" />
        </div>
        <button class="btn block" type="submit">Owner Login</button>
      </form>
      <div class="link-row">
        Don't have an account? <a href="owner-register.html">Register as an Owner</a>
      </div>
      <div class="link-row">
        <a href="user-login.html">Looking for a home instead? User Login</a>
      </div>
      <div class="link-row" style="margin-top:10px;">
        <a href="index.html" style="color:var(--muted);font-size:13px;">&larr; Back to Home</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/portal-auth.js"></script>
  <script>
    initAuthForm({ kind: 'owner', formId: 'loginForm', mode: 'login' });

    // Check if owner is already logged in
    (async () => {
      try {
        const token = localStorage.getItem('owner_token');
        if (!token) return;
        const data = await api.get('/owner/auth/me');
        if (data && data.owner) {
          const banner = document.getElementById('alreadyLoggedIn');
          document.getElementById('loggedInName').textContent = data.owner.name || data.owner.email;
          banner.style.display = 'block';

          document.getElementById('ownerLogoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            logoutAs('owner');
          });
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
