<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Owner Registration · IND Homes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create Owner Account</h1>
      <p class="sub">List your properties on IND Homes.</p>
      <div id="alertBox"></div>
      <form id="registerForm">
        <div class="field">
          <label for="name">Full Name / Business Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="mobile">Mobile Number</label>
          <input type="tel" id="mobile" name="mobile" />
        </div>
        <div class="field">
          <label for="ownerType">Owner Type</label>
          <select id="ownerType" name="ownerType">
            <option value="Individual">Individual</option>
            <option value="Agency">Agency / Business</option>
          </select>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="8" required autocomplete="new-password" />
        </div>
        <button class="btn block" type="submit">Create Account</button>
      </form>
      <div class="link-row">Already have an account? <a href="owner-login.html">Owner Login</a></div>
      <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:16px;">
        After registering, your properties will be reviewed by our admin team before going live.
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/portal-auth.js"></script>
  <script>
    initAuthForm({ kind: 'owner', formId: 'registerForm', mode: 'register' });
  </script>
</body>
</html>
