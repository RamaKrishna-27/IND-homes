<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Create New Password · IND Homes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 id="pageTitle">Create New Password</h1>
      <p class="sub" id="pageSub">Choose a secure new password for your account.</p>
      <div id="alertBox"></div>
      <form id="resetForm">
        <div class="field">
          <label for="newPassword">New Password (minimum 8 characters)</label>
          <input type="password" id="newPassword" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters" />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password" placeholder="Confirm your new password" />
        </div>
        <button class="btn block" type="submit" id="resetBtn">Save New Password</button>
      </form>
      <div class="link-row" style="margin-top:20px;">
        <a href="owner-login.html" id="backLink">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');
    let role = (params.get('role') || 'owner').toLowerCase();
    if (!['owner', 'user', 'admin'].includes(role)) role = 'owner';

    const pageTitle = document.getElementById('pageTitle');
    const pageSub = document.getElementById('pageSub');
    const backLink = document.getElementById('backLink');

    const roleName = role.charAt(0).toUpperCase() + role.slice(1);
    pageTitle.textContent = `Create New ${roleName} Password`;
    pageSub.textContent = `Choose a new password for your ${role} account (${escapeHtml(email || '')}).`;
    backLink.href = `${role}-login.html`;
    backLink.textContent = `← Back to ${roleName} Login`;

    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('alertBox');
    const resetBtn = document.getElementById('resetBtn');

    if (!token || !email) {
      alertBox.innerHTML = `<div class="alert error">This password reset link is invalid or incomplete. Please request a new link.</div>`;
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        alertBox.innerHTML = `<div class="alert error">Password must be at least 8 characters long.</div>`;
        return;
      }

      if (newPassword !== confirmPassword) {
        alertBox.innerHTML = `<div class="alert error">Passwords do not match. Please verify and try again.</div>`;
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Updating password...';
      alertBox.innerHTML = '';

      try {
        const endpoint = `/${role}/auth/reset-password`;
        const data = await api.post(endpoint, { email, token, newPassword });
        alertBox.innerHTML = `<div class="alert success">${escapeHtml(data.message)} Redirecting to login...</div>`;
        form.style.display = 'none';
        setTimeout(() => {
          window.location.href = `${role}-login.html`;
        }, 1800);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
        resetBtn.disabled = false;
        resetBtn.textContent = 'Save New Password';
      }
    });
  </script>
</body>
</html>
