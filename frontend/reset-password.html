<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Create New Password · IND Homes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create New Password</h1>
      <p class="sub">Choose a new password for your admin account.</p>
      <div id="alertBox"></div>
      <form id="resetForm">
        <div class="field">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" minlength="8" required />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" minlength="8" required />
        </div>
        <button class="btn block" type="submit" id="resetBtn">Set New Password</button>
      </form>
      <div class="link-row"><a href="admin-login.html">Back to Admin Login</a></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('alertBox');
    const resetBtn = document.getElementById('resetBtn');

    if (!token || !email) {
      alertBox.innerHTML = `<div class="alert error">This reset link is invalid. Please request a new one.</div>`;
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        alertBox.innerHTML = `<div class="alert error">Passwords do not match.</div>`;
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Saving...';
      try {
        const data = await api.post('/admin/auth/reset-password', { email, token, newPassword });
        alertBox.innerHTML = `<div class="alert success">${escapeHtml(data.message)}</div>`;
        form.style.display = 'none';
        setTimeout(() => (window.location.href = 'admin-login.html'), 1800);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
        resetBtn.disabled = false;
        resetBtn.textContent = 'Set New Password';
      }
    });
  </script>
</body>
</html>
