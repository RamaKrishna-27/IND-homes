<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>User Registration · IND Homes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="sub">Save properties, contact owners, and schedule visits.</p>
      <div id="alertBox"></div>
      <form id="registerForm">
        <div class="field">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="mobile">Mobile Number</label>
          <input type="tel" id="mobile" name="mobile" />
        </div>
        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" name="city" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="8" required autocomplete="new-password" />
        </div>
        <button class="btn block" type="submit">Create Account</button>
      </form>
      <div class="link-row">Already have an account? <a href="user-login.html">Log In</a></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/portal-auth.js"></script>
  <script>
    initAuthForm({ kind: 'user', formId: 'registerForm', mode: 'register' });
  </script>
</body>
</html>
