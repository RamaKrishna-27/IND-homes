<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Users · IND Homes Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <h2 id="topbar-title">Users</h2>
        <div class="actions"><span id="notifBell"></span></div>
      </div>

      <div class="card">
        <div class="toolbar">
          <input type="text" id="searchBox" placeholder="Search by ID, name, email" />
          <button class="btn secondary" id="searchBtn">Search</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Email</th><th>Mobile</th><th>City</th>
              <th>Enquiries</th><th>Status</th><th>Registered</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr><td colspan="9" class="empty-state">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
